# Phục vụ bản build React và chuyển /api, /health sang backend (service "backend" trong docker-compose).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;      # một lượt chat có thể chờ OpenAI/Goong khá lâu
        client_max_body_size 20m;
    }

    location = /health {
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
