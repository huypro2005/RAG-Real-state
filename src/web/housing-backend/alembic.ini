[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# Ten file migration: <rev>_<mo_ta>.py. Dat rev de doc: alembic revision --rev-id 0002 -m "..."
# (File nay chi dung ASCII: Alembic doc .ini bang encoding cua he dieu hanh, cp1252 tren Windows.)
file_template = %%(rev)s_%%(slug)s
# sqlalchemy.url lay tu app.core.config (bien moi truong DATABASE_URL), khong ghi o day

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
